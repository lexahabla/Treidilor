# PLANTILLA (no instalada). Se instalaría en /etc/ssh/sshd_config.d/ en la etapa 2, validando antes con `sshd -t`,
# con `sshd -T -C user=...` para el usuario restringido Y para root, y con una sesión de respaldo abierta.
# Todas las directivas son válidas dentro de un bloque Match.
#
# PRECEDENCIA (verificada con pruebas reales, ver tests/ssh/): el nombre del archivo NO da prioridad por sí solo. Dentro de los bloques Match
# que coinciden con un usuario, para cada palabra clave GANA EL PRIMER VALOR LEÍDO, y los archivos de `sshd_config.d` se leen por orden
# alfabético. Un bloque Match anterior (de otro archivo) que toque las mismas palabras clave para este usuario prevalecería sobre este.
# Por eso: (1) el archivo se instala con un nombre que ordene PRIMERO (este: `00-tai-inspect.conf`; `99-…` PIERDE ante cualquier Match anterior que toque las mismas palabras); (2) la verificación obligatoria es siempre `sshd -T -C user=tai-inspect,...`;
# (3) la clave autorizada lleva además `restrict`, que solo puede RESTRINGIR más, nunca ampliar.
Match User tai-inspect
    # La clave autorizada vive en un archivo de ROOT: el usuario restringido no puede cambiarla ni añadir otras (no se usa ~/.ssh).
    AuthorizedKeysFile /etc/ssh/authorized_keys.tai-inspect
    AuthorizedKeysCommand none
    AuthorizedPrincipalsFile none
    ForceCommand /opt/tai-inspect/bin/tai-gate
    PermitTTY no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitOpen none
    GatewayPorts no
    PermitUserRC no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    MaxSessions 1
    MaxAuthTries 2
    ClientAliveInterval 30
    ClientAliveCountMax 2
